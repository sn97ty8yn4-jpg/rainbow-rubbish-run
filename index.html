function collisionScenery(){
 if(game.screen!=='drive')return;
 const axes=h=>[[Math.cos(h),-Math.sin(h)],[Math.sin(h),Math.cos(h)]];
 const A=axes(game.heading),halfW=1.76,halfL=4.22;
 let touched=false;
 // Iterative separating-axis collision solver for the truck footprint vs each actual house/shop.
 for(let iter=0;iter<4;iter++){
  let contact=null;
  for(const b of cameraSolids){
   if(Math.hypot(game.x-b.x,game.z-b.z)>16)continue;
   const B=axes(b.angle||0),dx=b.x-game.x,dz=b.z-game.z;
   let overlapMin=Infinity,normal=null,hit=true;
   for(const n of [A[0],A[1],B[0],B[1]]){
    const dot=(v,w)=>v[0]*w[0]+v[1]*w[1];
    const truckR=Math.abs(dot(n,A[0]))*halfW+Math.abs(dot(n,A[1]))*halfL;
    const buildingR=Math.abs(dot(n,B[0]))*(b.halfW||5.1)+Math.abs(dot(n,B[1]))*(b.halfL||4.6);
    const sep=dx*n[0]+dz*n[1],penetration=truckR+buildingR-Math.abs(sep);
    if(penetration<=0){hit=false;break}
    if(penetration<overlapMin){overlapMin=penetration;let sign=sep>=0?1:-1;normal=[n[0]*sign,n[1]*sign]}
   }
   if(hit&&normal&&(!contact||overlapMin<contact.depth))contact={depth:overlapMin,normal};
  }
  if(!contact)break;
  let push=contact.depth+.045;
  game.x-=contact.normal[0]*push;game.z-=contact.normal[1]*push;
  touched=true;
 }
 if(touched){game.v*=-.12;game.bump=Math.max(game.bump,.4);
  if(clock-lastBump>3.2){lastBump=clock;toast('🏠 🛑 BACK TO THE ROAD!',1400);tone(190,.12,.08)}}
 for(const p of LANDMARKS){let d=dist(game,p);if(d<8.6){game.x+=(game.x-p.x)/(d||1)*(8.6-d);game.z+=(game.z-p.z)/(d||1)*(8.6-d);game.v*=.42}}
}
