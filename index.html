// Reference-guided Australian side-loader: the carriage, jaws and cart are one kinematic rig.
// The real Bucher Sport lists an indicative 8–12s full cycle, 3.83–4.48m reach.
// All coordinates are metres in the truck's local frame (+X to collection side).
function hydraulicTimeline(t){
 t=clamp(t,0,1);
 const S=(a,b)=>smooth((t-a)/(b-a));
 let extension=0,lift=0,tilt=0,closed=0,phase='stowed';
 if(t<.15){extension=S(0,.15);phase='extending'}
 else if(t<.23){extension=1;closed=S(.15,.23);phase='gripping'}
 else if(t<.34){extension=1-.68*S(.23,.34);closed=1;lift=.12*S(.23,.34);phase='retracting'}
 else if(t<.56){extension=.32-.23*S(.34,.56);closed=1;lift=.12+.88*S(.34,.56);phase='lifting'}
 else if(t<.68){extension=.09;closed=1;lift=1;tilt=2.74*S(.56,.68);phase='tipping'}
 else if(t<.72){extension=.09;closed=1;lift=1;tilt=2.74+.10*Math.sin((t-.68)/.04*Math.PI*4);phase='shaking'}
 else if(t<.79){extension=.09;closed=1;lift=1;tilt=2.74*(1-S(.72,.79));phase='righting'}
 else if(t<.89){extension=.09+.43*S(.79,.89);closed=1;lift=1-S(.79,.89);phase='lowering'}
 else if(t<.94){extension=.52+.48*S(.89,.94);closed=1;phase='returning'}

 else {extension=1-S(.96,1);phase='stowing'}

}

function collisionScenery(){

 let touched=false;
 // Iterative separating-axis collision solver for the truck footprint vs each actual house/shop.
 for(let iter=0;iter<4;iter++){
  let contact=null;
  for(const b of cameraSolids){

   let overlapMin=Infinity,normal=null,hit=true;

    const dot=(v,w)=>v[0]*w[0]+v[1]*w[1];

   }

  }

 }
